name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact Engineering Compass Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false

      - name: Prove exact-Head checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Verify repository/runtime contract
        run: python3 scripts/verify_repo.py

      - name: Run runtime unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Smoke live GitHub collection and action-time freshness gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIVE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          request = {
              "target": {
                  "kind": "REPOSITORY_SCOPE",
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "ref": os.environ["LIVE_REF"],
              },
              "review_intent": "CI live freshness smoke for the authoritative action boundary.",
              "inspection_profile": "focused",
          }
          Path('/tmp/ec-request.json').write_text(json.dumps(request), encoding='utf-8')
          PY
          python3 -m engineering_compass collect --request /tmp/ec-request.json --out /tmp/ec-evidence.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from engineering_compass.model import expected_target_binding
          from engineering_compass.projection import project_action

          evidence = json.loads(Path('/tmp/ec-evidence.json').read_text(encoding='utf-8'))
          assert evidence['identity']['head_sha'] == os.environ['EXPECTED_HEAD']
          assert evidence['target']['kind'] == 'REPOSITORY_SCOPE'
          assert evidence['freshness'] == 'CURRENT'
          assert evidence['completeness']['surfaces']['target_stabilization'] is True

          assessment = {
              "assessment_version": 2,
              "target_binding": expected_target_binding(evidence),
              "method_coverage": [],
              "findings": [],
              "root_cause_groups": [],
              "unverified_areas": [],
              "owner_policy_decision_required": False,
              "specialist_review_required": False,
              "stop_reason": "CI live-freshness smoke has no repair finding.",
          }
          projection = project_action(evidence, assessment)
          assert projection['may_modify_code'] is False
          assert projection['action'] in {'STOP_AT_SUFFICIENCY', 'COLLECT_EVIDENCE'}
          PY

  prompt-pipeline-integration:
    needs: repository-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact Engineering Compass Head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false

      - name: Prove exact-Head checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Checkout locked Prompt-Pipeline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rezahh107/Prompt-Pipeline
          ref: 488499d9008b325264159f6c7fc5dbffe4a9e7b2
          path: .prompt-pipeline
          persist-credentials: false

      - name: Verify Prompt-Pipeline compatibility lock
        run: |
          python3 -m engineering_compass prompt-check \
            --prompt-pipeline-root .prompt-pipeline \
            --out /tmp/prompt-pipeline-check.json
          cat /tmp/prompt-pipeline-check.json

      - name: Build Prompt-Pipeline intake from runtime fixture
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from engineering_compass.prompt_pipeline import _build_prompt_pipeline_intake_current, write_intake
          data = json.loads(Path('fixtures/runtime/repair-full.json').read_text(encoding='utf-8'))
          write_intake('/tmp/engineering-compass-prompt-intake.json', _build_prompt_pipeline_intake_current(data['evidence'], data['assessment']))
          PY

      - name: Setup Node for locked Prompt-Pipeline
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.0'

      - name: Install locked Prompt-Pipeline dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          cd .prompt-pipeline
          pnpm install --frozen-lockfile

      - name: Invoke Prompt-Pipeline canonical request path
        run: |
          python3 -m engineering_compass compile-prompt \
            --intake /tmp/engineering-compass-prompt-intake.json \
            --prompt-pipeline-root .prompt-pipeline \
            --out /tmp/prompt-generation-result.json
          cat /tmp/prompt-generation-result.json

      - name: Enforce Prompt-Pipeline authority boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/prompt-generation-result.json').read_text(encoding='utf-8'))
          assert result['status'] == 'GENERATED'
          assert result['authority_state'] in {'review_pending', 'authorized'}
          if result['authority_state'] == 'review_pending':
              assert result['downstream_use_allowed'] is False
          PY
