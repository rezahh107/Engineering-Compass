name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository contract
        run: python3 scripts/verify_repo.py

      - name: Verify semantic fixture admission regressions
        run: python3 -m unittest discover -s tests -p 'test_semantic_fixture_contract.py'
